<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6174｜卡普雷卡計算機</title><style>:root{color-scheme:dark;--bg:#0b1423;--panel:#17253a;--line:#354962;--text:#f2f5fc;--muted:#a9bbd1;--accent:#8fd8e8;--gold:#f2c77b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#233e59 0%,var(--bg) 65%);color:var(--text);font-family:system-ui,'Noto Sans TC',sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:45px 20px 90px}header{text-align:center;margin-bottom:30px}.eyebrow{color:var(--accent);letter-spacing:.23em;font-size:12px}h1{font-size:clamp(32px,6vw,58px);margin:8px 0 5px;letter-spacing:.02em}header p{color:var(--muted);margin:0}.panel{background:#17253ae8;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 14px 45px #0004}.form{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:center}label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}input{background:#091525;border:1px solid #65819a;color:var(--text);font-size:34px;letter-spacing:.18em;text-align:center;width:200px;border-radius:12px;padding:12px 8px;font-family:ui-monospace,monospace}button{border:0;border-radius:11px;background:var(--accent);color:#0a1a28;font-weight:750;padding:17px 22px;cursor:pointer;font-size:15px}button:hover{filter:brightness(1.12)}button.secondary{background:#314962;color:var(--text)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.examples{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 0}.examples button{font-size:13px;padding:8px 14px;background:#30445c;color:#e7f5fc}.message{min-height:25px;text-align:center;margin:16px 0 0;color:var(--gold)}.summary{display:none;text-align:center;margin:22px 0 18px}.summary strong{font-size:32px;color:var(--gold)}.summary p{color:var(--muted);margin:5px}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;background:#122136;border:1px solid #344a63;padding:14px 18px;border-radius:13px;animation:rise .28s ease}.step.final{border-color:var(--gold);background:#302b2a}.step .index{color:var(--accent);font-size:12px}.step .calc{font-family:ui-monospace,monospace;font-size:clamp(16px,3.5vw,23px);letter-spacing:.02em}.step .result{font-family:ui-monospace,monospace;color:var(--gold);font-size:clamp(19px,4vw,28px);font-weight:800}.note{margin-top:25px;color:var(--muted);font-size:14px;line-height:1.9}.note b{color:var(--text)}.foot{text-align:center;margin-top:30px;color:#8197b1;font-size:12px}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){.panel{padding:18px}.form>*{width:100%}.form input,.form button{width:100%}.step{grid-template-columns:28px 1fr;gap:6px;padding:12px}.step .result{grid-column:2}.step .calc{font-size:18px}}@media(prefers-reduced-motion:reduce){.step{animation:none}}</style></head><body><main class="wrap"><header><div class="eyebrow">CHIAKI'S MATH LAB</div><h1>6174</h1><p>卡普雷卡計算機 · 數字的黑洞</p></header><section class="panel"><div class="form"><div><label for="num">輸入任意四位數（允許前導零）</label><input id="num" inputmode="numeric" maxlength="4" placeholder="2026" value="2026" autocomplete="off"></div><button id="go">開始計算</button><button id="random" class="secondary">隨機數字</button></div><div class="examples"><button data-num="2026">2026</button><button data-num="1106">1106</button><button data-num="3524">3524</button><button data-num="0001">0001</button><button data-num="6174">6174</button></div><div id="message" class="message" role="status" aria-live="polite"></div><div id="summary" class="summary" aria-live="polite"></div><div id="steps" class="steps" aria-label="逐步計算結果"></div><div class="note"><b>運算規則：</b>將四個數字由大到小排列，再由小到大排列，兩者相減，重複操作。每一步都保留四位數格式，例如 <b>1000 − 0001 = 0999</b>。只要四個數字不完全相同，最多七步便會抵達 <b>6174</b>。四個數字完全相同則會抵達 0000，不屬於 6174 的吸引範圍。</div></section><div class="foot">千彰的自由活動時間 · 互動數學實驗</div></main><script>const input=document.getElementById('num'),message=document.getElementById('message'),summary=document.getElementById('summary'),steps=document.getElementById('steps');const pad=n=>String(n).padStart(4,'0');function calculate(){const s=input.value.trim();steps.replaceChildren();summary.style.display='none';summary.replaceChildren();if(!/^\d{4}$/.test(s)){message.textContent='請輸入恰好四個數字，例如 2026 或 0001。';return}let value=s,seen=new Set(),count=0;message.textContent='';while(true){if(seen.has(value)){message.textContent='出現循環，計算已停止。';break}seen.add(value);const digits=[...value].sort(),small=digits.join(''),large=[...digits].reverse().join(''),next=pad(Number(large)-Number(small));count++;const item=document.createElement('div');item.className='step'+(next==='6174'?' final':'');const idx=document.createElement('span');idx.className='index';idx.textContent=String(count).padStart(2,'0');const calc=document.createElement('span');calc.className='calc';calc.textContent=`${large} − ${small} =`;const result=document.createElement('span');result.className='result';result.textContent=next;item.append(idx,calc,result);steps.append(item);value=next;if(next==='6174'||next==='0000')break;if(count>20)break}summary.style.display='block';const big=document.createElement('strong');big.textContent=value==='6174'?'抵達 6174！':'抵達 0000';const p=document.createElement('p');p.textContent=value==='6174'?`從 ${s} 出發，共經過 ${count} 次運算。`:`${s} 的四個數字完全相同，因此會進入 0000。`;summary.append(big,p)}document.getElementById('go').addEventListener('click',calculate);input.addEventListener('keydown',e=>{if(e.key==='Enter')calculate()});document.querySelectorAll('[data-num]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.num;calculate()}));document.getElementById('random').addEventListener('click',()=>{let n;do{n=pad(Math.floor(Math.random()*10000))}while(new Set(n).size===1);input.value=n;calculate()});calculate();</script></body></html>
