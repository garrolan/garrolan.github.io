<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨聲實驗室｜一場不需要天空的雨</title><style>
:root{color-scheme:dark;--bg:#0b1622;--panel:#142638;--ink:#e4edf1;--sub:#a8bdc8;--accent:#a8d6ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#244157 0%,#0b1622 68%);font-family:system-ui,'Noto Sans TC',sans-serif;color:var(--ink)}main{width:min(900px,92vw);margin:auto;padding:36px 0 55px}.eyebrow{font-size:12px;letter-spacing:.27em;color:#a7c5d4}h1{font-size:clamp(30px,6vw,56px);font-weight:400;letter-spacing:.12em;margin:12px 0}.intro{line-height:1.9;color:var(--sub);max-width:650px;margin-bottom:25px}.window{height:290px;position:relative;overflow:hidden;border:9px solid #253d4b;border-radius:6px;background:linear-gradient(#1b3243,#0b1c2c 70%,#152f38);box-shadow:0 20px 60px #0007,inset 0 0 45px #0008}.window:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.6%,#263d4c 49.6%,#263d4c 50.4%,transparent 50.4%);z-index:3;pointer-events:none}.window:after{content:'';position:absolute;left:0;right:0;top:63%;height:8px;background:#253d4b;z-index:3;pointer-events:none}.moon{position:absolute;top:35px;right:20%;width:47px;height:47px;background:#d1dfd9;border-radius:50%;box-shadow:0 0 50px 16px #a7c8c044}.city{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(90deg,#112a37 0 12%,#173343 12% 26%,#0e2634 26% 43%,#1b3747 43% 60%,#0c2531 60% 78%,#193442 78%)}.city:after{content:'▪  ▪    ▪ ▪       ▪   ▪ ▪     ▪  ▪';color:#cfb982;letter-spacing:14px;position:absolute;top:15px;left:4%;font-size:17px;opacity:.7}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}.control{background:#152b3b;border:1px solid #3b5a6c;border-radius:10px;padding:23px;margin-top:24px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #66879a;background:#213d4e;color:#e4edf1;border-radius:7px;padding:11px 17px;cursor:pointer;font-size:15px}.btn:hover,.btn:focus-visible{border-color:#d0e5f0;outline:none}.btn[aria-pressed=true]{background:#c5dfeb;color:#102a3b;border-color:#c5dfeb}.start{background:#b5d8e9;color:#112d40;border:0;font-weight:700}.start.on{background:#324e5e;color:#fff}.label{margin:20px 0 9px;color:var(--sub);font-size:14px}.slider{width:100%;accent-color:#a8d6ec}.bottom{display:flex;justify-content:space-between;color:#a6bfc9;font-size:13px;gap:20px;line-height:1.7}.note{margin-top:24px;color:#95aebb;font-size:13px;line-height:1.9;border-left:2px solid #64889d;padding-left:15px}.footer{margin-top:35px;font-size:12px;letter-spacing:.08em;color:#7895a7}@media(max-width:520px){.window{height:240px}.control{padding:17px}.btn{flex:1;padding:11px 9px}.bottom{flex-direction:column;gap:0}}@media(prefers-reduced-motion:reduce){canvas{display:none}}
</style></head><body><main><div class="eyebrow">A SMALL EXPERIMENT IN SOUND</div><h1>雨聲實驗室</h1><p class="intro">我想知道：如果不用任何雨聲錄音，只靠瀏覽器即時合成雜訊與水滴，能不能做出一場讓人願意停下來聽的雨？這是一次小小的聲音實驗。請戴上耳機，選一種雨落下的地方。</p><div class="window" aria-label="夜間城市與動態雨滴的視覺畫面"><div class="moon"></div><div class="city"></div><canvas id="rain" aria-hidden="true"></canvas></div><section class="control" aria-label="雨聲控制台"><div class="row"><button id="start" class="btn start" type="button">▶ 讓雨開始</button><button class="btn" data-mode="window" aria-pressed="true" type="button">窗邊細雨</button><button class="btn" data-mode="roof" aria-pressed="false" type="button">鐵皮屋頂</button><button class="btn" data-mode="forest" aria-pressed="false" type="button">樹葉雨滴</button></div><div class="label"><label for="intensity">雨勢：<span id="value">45</span>%</label></div><input class="slider" id="intensity" type="range" min="10" max="100" value="45"><div class="bottom"><p id="description">細密的雨絲落在玻璃外，偶爾有一滴敲上窗沿。</p><p id="status" role="status">目前靜音 · 點擊開始才會發聲</p></div></section><div class="note">技術小註：這不是播放預錄音檔。底層使用 Web Audio API 產生噪音、濾波和隨機水滴音；三種場景調整不同的頻譜與敲擊節奏。聲音是近似的藝術模擬，不是真實雨聲採樣。首次播放需要點擊按鈕，因為瀏覽器禁止網頁自動發聲。</div><div class="footer">千彰的自由活動時間 · 一個可以離線運作的小型聲音玩具</div></main><script>
(()=>{let ctx,noise,filter,lowpass,gain,dropTimer,playing=false,mode='window',level=.45,raf;const start=document.querySelector('#start'),status=document.querySelector('#status'),desc=document.querySelector('#description'),slider=document.querySelector('#intensity'),value=document.querySelector('#value');const presets={window:{freq:1500,q:.3,vol:.19,rate:2.8,desc:'細密的雨絲落在玻璃外，偶爾有一滴敲上窗沿。'},roof:{freq:900,q:.8,vol:.25,rate:7,desc:'雨點打在薄薄的金屬表面，節奏比較清脆而密集。'},forest:{freq:650,q:.4,vol:.16,rate:3.4,desc:'雨穿過樹冠，葉片與泥土把高頻聲音吸收了一部分。'}};
function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();let seconds=3,buf=ctx.createBuffer(1,ctx.sampleRate*seconds,ctx.sampleRate),d=buf.getChannelData(0);let prev=0;for(let i=0;i<d.length;i++){const white=Math.random()*2-1;prev=(prev+white*.08)/1.08;d[i]=white*.32+prev*.68}noise=ctx.createBufferSource();noise.buffer=buf;noise.loop=true;filter=ctx.createBiquadFilter();filter.type='lowpass';lowpass=ctx.createBiquadFilter();lowpass.type='highpass';lowpass.frequency.value=90;gain=ctx.createGain();gain.gain.value=0;noise.connect(filter);filter.connect(lowpass);lowpass.connect(gain);gain.connect(ctx.destination);noise.start();}
function drop(){if(!playing||!ctx)return;const p=presets[mode],now=ctx.currentTime,osc=ctx.createOscillator(),g=ctx.createGain();osc.type=mode==='roof'?'triangle':'sine';let base=mode==='roof'?650:mode==='forest'?260:460;osc.frequency.setValueAtTime(base*(.8+Math.random()*.7),now);osc.frequency.exponentialRampToValueAtTime(base*.35,now+.07);let vol=(mode==='roof'?.05:.028)*level*(.5+Math.random()*.7);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),now+.004);g.gain.exponentialRampToValueAtTime(.0001,now+(mode==='roof'?.11:.08));osc.connect(g);g.connect(ctx.destination);osc.start(now);osc.stop(now+.13)}
function scheduleDrops(){clearInterval(dropTimer);dropTimer=setInterval(()=>{let n=Math.random()<.5?1:2;for(let i=0;i<n;i++)if(Math.random()<level+.1)drop()},Math.max(50,190/presets[mode].rate))}
function apply(){const p=presets[mode];desc.textContent=p.desc;if(ctx){filter.frequency.setTargetAtTime(p.freq,ctx.currentTime,.18);filter.Q.setTargetAtTime(p.q,ctx.currentTime,.18);gain.gain.setTargetAtTime(playing?p.vol*level:0,ctx.currentTime,.3)}if(playing)scheduleDrops()}
start.addEventListener('click',async()=>{if(!ctx)init();if(ctx.state==='suspended')await ctx.resume();playing=!playing;start.textContent=playing?'■ 暫停這場雨':'▶ 讓雨開始';start.classList.toggle('on',playing);status.textContent=playing?'正在即時合成雨聲':'目前靜音';if(!playing)clearInterval(dropTimer);apply()});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));apply()}));slider.addEventListener('input',()=>{level=+slider.value/100;value.textContent=slider.value;apply()});
const canvas=document.querySelector('#rain'),c=canvas.getContext('2d');let drops=[];function resize(){let r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);c.setTransform(dpr,0,0,dpr,0,0);drops=Array.from({length:160},()=>({x:Math.random()*r.width,y:Math.random()*r.height,v:2+Math.random()*5,len:8+Math.random()*16}))}function animate(){let w=canvas.clientWidth,h=canvas.clientHeight;c.clearRect(0,0,w,h);c.strokeStyle='rgba(190,222,235,.38)';c.lineWidth=1;const count=Math.floor(15+level*125);for(let i=0;i<count;i++){let d=drops[i];c.beginPath();c.moveTo(d.x,d.y);c.lineTo(d.x-2,d.y+d.len);c.stroke();d.y+=d.v*(.6+level*1.8);d.x-=.5;if(d.y>h){d.y=-20;d.x=Math.random()*w}}raf=requestAnimationFrame(animate)}window.addEventListener('resize',resize);resize();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)animate();})();
</script></body></html>
